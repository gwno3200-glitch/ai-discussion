<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 토론실</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--line:#303847;--text:#f2f4fa;--muted:#a0acbf;--accent:#91b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px 40px}h1{font-size:27px;margin:0}h2{font-size:16px;margin:0 0 12px}p{margin:5px 0 12px}.muted,small{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:14px 0}.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.agent{border:1px solid var(--line);padding:12px;border-radius:12px;min-width:0}.agent h3{margin:0 0 10px;font-size:15px}label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:9px;color:var(--text);background:#11151e;padding:10px;width:100%;min-width:0}input,textarea,select{font-size:16px}textarea{resize:vertical}button{width:auto;cursor:pointer;font-weight:650}button.primary{background:#91b8ff;color:#10213c;border-color:transparent}button:disabled{opacity:.45;cursor:default}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.status{overflow-wrap:anywhere;font-size:13px;color:var(--muted);margin-top:10px}progress{width:100%;height:8px;accent-color:var(--accent)}#chat{min-height:160px;max-height:56vh;overflow:auto;overscroll-behavior:contain}.msg{padding:12px 4px;border-bottom:1px solid var(--line)}.msg:last-child{border:0}.who{font-size:13px;font-weight:750;margin-bottom:6px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}details summary{cursor:pointer}#note{white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;color:#91b8ff;font-size:12px;border:1px solid #3b5278;border-radius:20px;padding:3px 9px} @media(max-width:620px){.agents{grid-template-columns:1fr}.agent{padding:10px}.agent h3{margin-bottom:4px}main{padding-top:16px}.opts{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="meta"><h1>AI 토론실</h1><span class="tag">로컬 · API 키 없음</span></div><p class="muted">AI 세 명이 대화 기록을 공유하며 순서대로 토론합니다. 모델은 한 번에 하나씩 실행합니다.</p>
<section class="panel"><details open id="config"><summary><strong>참가자 및 설정</strong></summary><div class="agents" id="agents" style="margin-top:12px"></div><div class="opts"><div><label for="rounds">한 번에 진행할 발언 수</label><input id="rounds" type="number" min="1" max="30" value="9"></div><div><label for="mode">발언 방식</label><select id="mode"><option value="ordered">순서대로 발언</option><option value="optional">발언 필요 없으면 건너뛰기</option></select></div></div><small>기본값은 같은 Qwen 모델에 서로 다른 역할을 부여합니다. 다른 모델을 선택하면 실제 모델을 교체합니다. 큰 모델은 아이폰에서 실행되지 않을 수 있습니다.</small></details></section>
<section class="panel"><label for="topic">토론 주제 / 중간 개입</label><textarea id="topic" rows="3" placeholder="예: 재미있는 RPG 전투 시스템을 설계해 봐."></textarea><div class="buttons"><button id="start" class="primary" disabled>토론 시작 / 재개</button><button id="send">발언 추가</button><button id="pause" disabled>일시정지</button><button id="clear">초기화</button></div><div class="status" id="status" role="status" aria-live="polite">라이브러리를 불러오는 중…</div><progress id="progress" max="1" value="0" hidden></progress></section>
<section class="panel"><div class="meta"><h2>대화 기록</h2><small id="count">0개 발언</small></div><div id="chat" aria-live="off"></div><div class="buttons"><button id="export">기록 내보내기</button></div></section>
<section class="panel"><h2>공유 메모장</h2><textarea id="note" rows="3" placeholder="결정 사항이나 기억할 내용을 적어 주세요. 다음 발언에 반영됩니다."></textarea><div class="buttons"><button id="summarize" disabled>AI에게 메모 정리 요청</button></div><small>대화 및 설정은 이 브라우저에 저장됩니다. 다른 기기와 동기화하지 않습니다. 모델 답변은 부정확할 수 있습니다.</small></section>
</main><script type="module">
const $=id=>document.getElementById(id), DEFAULT='Qwen2.5-0.5B-Instruct-q0f16-MLC', FALLBACK='Qwen2.5-0.5B-Instruct-q4f16_1-MLC', COLORS=['#8dbaff','#f2aa86','#83d7b7'];
const defaults=[{name:'AI A',role:'새로운 아이디어와 해결책 제안',model:DEFAULT},{name:'AI B',role:'앞선 의견의 문제점과 근거 검토',model:DEFAULT},{name:'AI C',role:'의견 종합 및 구체적인 개선안 제시',model:DEFAULT}];
let stored={};try{stored=JSON.parse(localStorage.getItem('local-ai-debate-v1')||'{}')||{}}catch{}
let agents=Array.isArray(stored.agents)&&stored.agents.length===3?stored.agents:defaults.map(a=>({...a})), history=Array.isArray(stored.history)?stored.history:[], turn=Number.isInteger(stored.turn)?stored.turn:0, busy=false, paused=false, webllm, engine, loaded='', modelIds=[];
$('note').value=stored.note||'';$('rounds').value=stored.rounds||9;$('mode').value=stored.mode==='optional'?'optional':'ordered';
function status(s){$('status').textContent=s}function save(){try{localStorage.setItem('local-ai-debate-v1',JSON.stringify({agents,history,turn,note:$('note').value,rounds:$('rounds').value,mode:$('mode').value}))}catch{}}
function fields(){ $('agents').replaceChildren(); agents.forEach((a,i)=>{const box=document.createElement('div');box.className='agent';const h=document.createElement('h3');h.textContent=`참가자 ${i+1}`;h.style.color=COLORS[i];box.append(h);for(const [key,title] of [['name','이름'],['role','역할'],['model','모델']]){const lab=document.createElement('label');lab.textContent=title;const el=document.createElement(key==='model'?'select':'input');el.id=`${key}-${i}`;lab.htmlFor=el.id;if(key==='model'){const ids=[...new Set([a.model,...modelIds])];for(const id of ids){const op=document.createElement('option');op.value=id;op.textContent=id;el.append(op)}}else{el.maxLength=key==='name'?30:180}el.value=a[key];el.addEventListener('input',()=>{a[key]=el.value;save()});box.append(lab,el)}$('agents').append(box)})}
function render(){const chat=$('chat');chat.replaceChildren();if(!history.length){const p=document.createElement('p');p.className='muted';p.textContent='토론 주제를 입력하고 시작하세요.';chat.append(p)}for(const item of history){const row=document.createElement('div');row.className='msg';const who=document.createElement('div');who.className='who';who.style.color=COLORS[item.agent]||'#d0d6e2';who.textContent=item.name;const body=document.createElement('div');body.className='body';body.textContent=item.text;row.append(who,body);chat.append(row)}chat.scrollTop=chat.scrollHeight;$('count').textContent=`${history.length}개 발언`}
function add(name,text,agent=-1){history.push({name,text,agent});save();render()}
function lock(v){busy=v;$('start').disabled=v||!webllm;$('pause').disabled=!v;$('clear').disabled=v;$('summarize').disabled=v||!webllm;for(const e of $('agents').querySelectorAll('input,select'))e.disabled=v;}
function clippedHistory(){return history.slice(-10).map(x=>`${x.name}: ${x.text.slice(0,500)}`).join('\n').slice(-2200)}
async function load(id){if(loaded===id&&engine)return;if(!modelIds.includes(id))throw new Error('이 모델은 현재 WebLLM 목록에 없습니다: '+id);if(engine){await engine.unload();loaded='';}else engine=new webllm.MLCEngine({initProgressCallback:p=>{status(p.text||'모델 준비 중…');$('progress').hidden=false;$('progress').value=p.progress||0;}});status('모델 불러오는 중: '+id);$('progress').hidden=false;$('progress').value=0;await engine.reload(id,{context_window_size:2048});loaded=id;$('progress').hidden=true;}
async function generate(a,summary=false){await load(a.model);if(paused)return null;status(summary?'메모 정리 중…':`${a.name} 발언 생성 중…`);const first=history.find(x=>x.agent===-1)?.text||'';const prompt=summary?`토론의 결정 사항과 미해결 문제를 한국어로 간단히 정리해.\n기존 메모: ${$('note').value.slice(0,350)}\n${clippedHistory()}`:`너는 ${a.name}이다. 역할: ${a.role}. 다른 참가자의 말을 참고하여 한국어로 2~4문장만 발언해. 참가자의 말에 구체적으로 반응하고, 사용자나 다른 참가자인 척하지 마. ${$('mode').value==='optional'?'새 의견이 전혀 없으면 [PASS]만 출력해.':''}\n주제: ${first.slice(0,350)}\n공유 메모: ${$('note').value.slice(0,300)}\n최근 대화:\n${clippedHistory()}\n이제 ${a.name}의 차례다.`;const r=await engine.chat.completions.create({messages:[{role:'user',content:prompt}],temperature:0.7,max_tokens:192});return r.choices[0]?.message?.content?.trim()||''}
async function run(summary=false){if(busy||!webllm)return;if(!history.length&&!summary){status('먼저 토론 주제를 입력하세요.');return}paused=false;lock(true);try{if(summary){const text=await generate(agents[2],true);if(text&&!paused){$('note').value=text;save()}}else{const n=Math.max(1,Math.min(30,Math.trunc(Number($('rounds').value)||9)));let skips=0;for(let t=0;t<n&&!paused;t++){const i=turn%3,a=agents[i],text=await generate(a);if(paused)break;turn++;if(text&&text.trim()!=='[PASS]'){add(a.name||`AI ${i+1}`,text,i);skips=0}else{skips++;save()}if(skips>=3)break}}status(paused?'일시정지됨. 재개 버튼으로 이어서 진행하세요.':'진행 완료. 재개하거나 새 발언을 추가하세요.')}catch(e){status('오류: '+(e?.message||e)+' — 메모리가 부족하면 더 작은 모델을 선택하거나 페이지를 새로고침하세요.');if(engine){try{await engine.unload()}catch{}engine=null;loaded=''}}finally{$('progress').hidden=true;lock(false)}}
function send(){const v=$('topic').value.trim();if(v){add('사용자',v);$('topic').value='';return true}return false}
$('send').onclick=()=>{send()};$('start').onclick=()=>{send();run()};$('pause').onclick=()=>{paused=true;status('현재 발언을 중단하는 중…');try{engine?.interruptGenerate()}catch{}};$('clear').onclick=()=>{if(!busy&&confirm('대화 기록과 공유 메모를 지울까요?')){history=[];turn=0;$('note').value='';save();render();status('초기화 완료')}};$('summarize').onclick=()=>run(true);$('note').oninput=save;$('mode').onchange=save;$('rounds').onchange=save;$('export').onclick=()=>{const text=history.map(x=>x.name+': '+x.text).join('\n\n')+'\n\n공유 메모:\n'+$('note').value;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ai-debate.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
fields();render();
(async()=>{try{if(!navigator.gpu)throw new Error('WebGPU를 사용할 수 없습니다. HTTPS 주소에서 Safari로 열어 주세요.');webllm=await import('https://esm.run/@mlc-ai/web-llm@0.2.89');modelIds=webllm.prebuiltAppConfig.model_list.filter(x=>/instruct|chat/i.test(x.model_id)&&! /embedding|vision/i.test(x.model_id)).map(x=>x.model_id);const fallback=modelIds.includes(FALLBACK)?FALLBACK:modelIds[0];if(!fallback)throw new Error('모델 목록을 불러오지 못했습니다.');let changed=false;for(const a of agents){if(!modelIds.includes(a.model)){a.model=fallback;changed=true}}fields();save();lock(false);status(changed?'기본 모델이 목록에 없어 지원되는 대체 모델을 선택했습니다. 토론 시작을 눌러 주세요.':'준비 완료. 토론 시작을 누르면 모델을 불러옵니다.')}catch(e){webllm=null;lock(false);status('실행 환경 오류: '+(e?.message||e))}})();
</script></body></html>
